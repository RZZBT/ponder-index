# The truth check for the Rust library animations (src/rust_libs/*.cjs). truth/run.cjs copies this file and
# prelude.rs into .cache/rust-libs-truth and adds main.rs: one line per animation, so rust/lib-ra-check.cjs can ask
# rust-analyzer where the animated call on each line lands. Versions: the newest of each crate.
[package]
name = "ponder-libs-truth"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
regex = "1"
itertools = "0.15"
chrono = "0.4"
rand = "0.10"
fastrand = "2"
uuid = { version = "1", features = ["v4", "v5", "v7"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
rayon = "1"
clap = { version = "4", features = ["derive", "env"] }
bytes = "1"
byteorder = "1"
indexmap = "2"
smallvec = "1"
once_cell = "1"
parking_lot = "0.12"
crossbeam-channel = "0.5"
crossbeam-utils = "0.8"
dashmap = "6"
num-traits = "0.2"
num-bigint = "0.5"
num-integer = "0.1"
url = "2"
http = "1"
toml = "0.9"
csv = "1"
percent-encoding = "2"
form_urlencoded = "1"
semver = "1"
walkdir = "2"
glob = "0.3"
tempfile = "3"
memchr = "2"
either = "1"
nom = "8"
sha2 = "0.11"
crc32fast = "1"
base64 = "0.23"
hex = "0.4"
ndarray = "0.17"
rust_decimal = { version = "1", features = ["maths"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
humantime = "2"
itoa = "1"
unicode-width = "0.2"
unicode-normalization = "0.1"
petgraph = "0.8"
lru = "0.19"
arrayvec = "0.7"
similar = "3"
shlex = "2"
log = "0.4"
textwrap = "0.16"
heck = "0.5"
strsim = "0.11"
unicode-segmentation = "1"
